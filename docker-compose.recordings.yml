# LEGACY LOCAL-DEV COMPOSE OVERRIDE ONLY.
# Authoritative production deployment uses compose.production.yml via scripts/start.ps1.
name: intelligent-vms

x-recording-environment: &recording-environment
  RECORDING_DATABASE: postgres
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  VMS_OPERATOR_PASSWORD: ${VMS_OPERATOR_PASSWORD:?Set a 12+ character operator password}
  VMS_OPERATOR_USERNAME: ${VMS_OPERATOR_USERNAME:-admin}
  VMS_SESSION_SECRET: ${VMS_SESSION_SECRET:?Set a random 32+ character session secret}
  VMS_SECURE_COOKIE: ${VMS_SECURE_COOKIE:-false}
  VMS_CAMERA_NETWORKS: ${VMS_CAMERA_NETWORKS:-}
  RECORDING_STORAGE_PATH: /app/storage/recordings
  RECORDING_SEGMENT_SECONDS: 1800
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-21474836480}
  MIN_FREE_BYTES: ${MIN_FREE_BYTES:-1073741824}
  FFMPEG_THREADS: ${FFMPEG_THREADS:-2}
  MEDIAMTX_API_URL: http://mediamtx:9997
  MEDIAMTX_API_USER: vms-api
  MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:?Set MEDIAMTX_API_PASSWORD}
  REDIS_URL: redis://redis:6379/0
  VMS_TRUSTED_PROXY_CIDRS: ${VMS_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
  MEDIAMTX_RTSP_URL: rtsp://mediamtx:8554
  RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-30}
  RETENTION_FREE_HIGH_BYTES: ${RETENTION_FREE_HIGH_BYTES:-11811160064}
  AI_SAMPLE_INTERVAL_MS: ${AI_SAMPLE_INTERVAL_MS:-2000}
  AI_BATCH_SIZE: ${AI_BATCH_SIZE:-4}
  AI_MAX_CAMERAS: ${AI_MAX_CAMERAS:-4}
  AI_SHARD_INDEX: ${AI_SHARD_INDEX:-0}
  AI_SHARD_TOTAL: ${AI_SHARD_TOTAL:-1}
  RTSP_RECORD_AUDIO_MODE: ${RTSP_RECORD_AUDIO_MODE:-aac}
  LOITERING_THRESHOLD_SECONDS: ${LOITERING_THRESHOLD_SECONDS:-1800}
  UNATTENDED_OBJECT_THRESHOLD_SECONDS: ${UNATTENDED_OBJECT_THRESHOLD_SECONDS:-1800}
  UNATTENDED_DISTANCE_PIXELS: ${UNATTENDED_DISTANCE_PIXELS:-80}
  AI_INTRUSION_ZONES: "${AI_INTRUSION_ZONES:-{}}"

services:
  recording-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: intelligent-vms-recordings:local
    environment: *recording-environment
    volumes:
      - recording_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]

  recording-api:
    image: intelligent-vms-recordings:local
    environment: *recording-environment
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - recording_data:/app/storage
    depends_on:
      recording-init:
        condition: service_completed_successfully
      mediamtx:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${VMS_API_WORKERS:-4}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3

  recording-worker:
    profiles: [internal-test]
    image: intelligent-vms-recordings:local
    environment: *recording-environment
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "services.recording_engine.worker"]
    volumes:
      - recording_data:/app/storage
    depends_on:
      recording-init:
        condition: service_completed_successfully
    stop_grace_period: 30s

  rtsp-recorder:
    image: intelligent-vms-recordings:local
    environment: *recording-environment
    restart: unless-stopped
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "services.recording_engine.rtsp_recorder"]
    volumes:
      - recording_data:/app/storage
    depends_on:
      recording-init:
        condition: service_completed_successfully
      recording-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from backend.app.core.config import load_settings; from sqlalchemy import create_engine, text; e=create_engine(load_settings()['database_url']); e.connect().execute(text('SELECT 1')); e.dispose()"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s

  storage-retention:
    profiles: [retention]
    image: intelligent-vms-recordings:local
    environment: *recording-environment
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["python", "-m", "services.recording_engine.retention"]
    volumes:
      - recording_data:/app/storage
    depends_on:
      recording-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from backend.app.core.config import load_settings; from sqlalchemy import create_engine, text; e=create_engine(load_settings()['database_url']); e.connect().execute(text('SELECT 1')); e.dispose()"]
      interval: 60s
      timeout: 5s
      retries: 3

  ai-worker:
    build:
      context: .
      dockerfile: services/ai_engine/Dockerfile
    profiles: [ai]
    environment: *recording-environment
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - recording_data:/app/storage
      - ai_model_cache:/home/aiworker/.cache/torch
    depends_on:
      recording-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
      args:
        NGINX_CONFIG: nginx.conf
    image: intelligent-vms-web:0.1.0
    profiles: [production]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/tls:/etc/nginx/tls:ro
    depends_on:
      - recording-api
      - mediamtx

volumes:
  recording_data:
  ai_model_cache:
