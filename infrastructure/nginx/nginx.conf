server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21g;

    location = /_stream_auth {
        internal;
        proxy_pass http://recording-api:8000/api/stream-access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location ^~ /live/ {
        auth_request /_stream_auth;
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass http://mediamtx:8888;
        proxy_redirect / /live/;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    location ^~ /live-webrtc/ {
        auth_request /_stream_auth;
        rewrite ^/live-webrtc/(.*)$ /$1 break;
        proxy_pass http://mediamtx:8889;
        proxy_redirect / /live-webrtc/;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    location ^~ /api/videos {
        proxy_pass http://recording-api:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://recording-api:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
