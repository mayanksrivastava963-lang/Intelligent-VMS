# Internal synthetic validation only. Never include in a customer deployment.
services:
  validation-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [validation_database:/var/lib/postgresql]
    networks: [control]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      retries: 12
  recording-init:
    depends_on:
      validation-db: {condition: service_healthy}
  mediamtx:
    networks: [control, egress, synthetic]
  synthetic-source:
    image: bluenviron/mediamtx:1.21.4
    volumes: [./infrastructure/mediamtx/synthetic.yml:/mediamtx.yml:ro]
    networks:
      synthetic: {ipv4_address: 172.30.86.10}
    mem_limit: 256m
networks:
  synthetic:
    internal: true
    ipam:
      config: [{subnet: 172.30.86.0/24}]
volumes:
  validation_database: {}
