name: intelligent-vms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    restart: unless-stopped
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${MEDIAMTX_API_PASSWORD:?Set MEDIAMTX_API_PASSWORD}
      MTX_WEBRTCADDITIONALHOSTS: ${VMS_PUBLIC_HOST:-127.0.0.1}
    volumes:
      - ./infrastructure/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8189:8189/udp"
    expose:
      - "8554"
      - "8888"
      - "8889"
      - "9997"

volumes:
  postgres_data:
  redis_data:
